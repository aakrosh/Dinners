<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dinner Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    /* ── Tokens ───────────────────────────────────────────────────── */
    :root {
      --bg:           #EDF0EA;
      --surface:      #FFFFFF;
      --surface-2:    #F3F6F0;
      --border:       #D2D8CC;
      --text:         #192219;
      --text-muted:   #647268;
      --primary:      #2A5E3C;
      --primary-h:    #224E32;
      --primary-fg:   #FFFFFF;
      --primary-lt:   #E3EFE8;
      --accent:       #B87422;
      --tag-bg:       #E4E8DF;
      --tag-text:     #485A4C;
      --sh-sm:        0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.08);
      --sh-md:        0 4px 8px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.06);
      --sh-lg:        0 12px 28px rgba(0,0,0,.12), 0 4px 8px rgba(0,0,0,.06);
      --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
      --danger:        #B94040;
      --danger-border: #D4AAAA;
      --danger-bg:     #FDF0F0;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:           #131A14;
        --surface:      #1C2720;
        --surface-2:    #182019;
        --border:       #293B2D;
        --text:         #DCE8DE;
        --text-muted:   #87A08B;
        --primary:      #4B9267;
        --primary-h:    #3E7D58;
        --primary-fg:   #0C190F;
        --primary-lt:   #193026;
        --accent:       #CC9040;
        --tag-bg:       #1F2E24;
        --tag-text:     #88A88E;
        --sh-sm:        0 1px 2px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.25);
        --sh-md:        0 4px 8px rgba(0,0,0,.35), 0 2px 4px rgba(0,0,0,.25);
        --sh-lg:        0 12px 28px rgba(0,0,0,.55), 0 4px 8px rgba(0,0,0,.35);
        --danger:        #E06060;
        --danger-border: #6B3434;
        --danger-bg:     #2A1A1A;
      }
    }

    :root[data-theme="dark"] {
      --bg:           #131A14;
      --surface:      #1C2720;
      --surface-2:    #182019;
      --border:       #293B2D;
      --text:         #DCE8DE;
      --text-muted:   #87A08B;
      --primary:      #4B9267;
      --primary-h:    #3E7D58;
      --primary-fg:   #0C190F;
      --primary-lt:   #193026;
      --accent:       #CC9040;
      --tag-bg:       #1F2E24;
      --tag-text:     #88A88E;
      --sh-sm:        0 1px 2px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.25);
      --sh-md:        0 4px 8px rgba(0,0,0,.35), 0 2px 4px rgba(0,0,0,.25);
      --sh-lg:        0 12px 28px rgba(0,0,0,.55), 0 4px 8px rgba(0,0,0,.35);
      --danger:        #E06060;
      --danger-border: #6B3434;
      --danger-bg:     #2A1A1A;
    }

    /* ── Reset ────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    button { font-family: inherit; }

    body {
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ───────────────────────────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 200;
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding-inline: 24px;
      padding-block: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      gap: 16px;
    }

    .brand {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--primary);
      white-space: nowrap;
    }

    .view-nav {
      display: flex;
      gap: 2px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 3px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      border-radius: 4px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: color .15s, background .15s, box-shadow .15s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .nav-btn:hover { color: var(--text); }

    .nav-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--sh-sm);
    }

    .nav-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    .badge {
      min-width: 18px;
      height: 18px;
      padding-inline: 5px;
      background: var(--primary);
      color: var(--primary-fg);
      border-radius: 9px;
      font-size: 11px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Main ─────────────────────────────────────────────────────── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding-inline: 24px;
      padding-block: 32px 132px;
    }

    .view { display: none; }
    .view.active { display: block; }

    .view-eyebrow {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* ── Recipe grid ──────────────────────────────────────────────── */
    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    @media (max-width: 820px)  { .recipe-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px)  {
      .recipe-grid { grid-template-columns: 1fr; }
      main { padding-inline: 16px; }
      .header-inner { padding-inline: 16px; }
    }

    /* ── Recipe card ──────────────────────────────────────────────── */
    .recipe-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r-md);
      padding: 18px 18px 16px;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0;
      transition: border-color .15s, background .15s, box-shadow .15s, transform .12s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .recipe-card:hover {
      border-color: var(--primary);
      box-shadow: var(--sh-md);
      transform: translateY(-1px);
    }

    .recipe-card:active { transform: translateY(0); box-shadow: none; }

    .recipe-card.selected {
      border-color: var(--primary);
      background: var(--primary-lt);
    }

    .recipe-card:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    .card-check {
      position: absolute;
      top: 13px;
      right: 13px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
      flex-shrink: 0;
    }

    .recipe-card.selected .card-check {
      background: var(--primary);
      border-color: var(--primary);
    }

    .card-check-icon {
      width: 11px;
      height: 11px;
      color: var(--primary-fg);
      opacity: 0;
      transition: opacity .15s;
    }

    .recipe-card.selected .card-check-icon { opacity: 1; }

    .card-name {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.2;
      color: var(--text);
      text-wrap: balance;
      padding-right: 26px;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-muted);
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .card-meta-sep { color: var(--border); }

    .card-tags { display: flex; flex-wrap: wrap; gap: 5px; }

    .tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .01em;
    }

    /* ── State messages ───────────────────────────────────────────── */
    .state-msg {
      grid-column: 1 / -1;
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 15px;
    }

    .state-msg.error { color: #c0392b; }

    .state-msg code {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 13px;
    }

    /* ── Clear-selections link ────────────────────────────────────── */
    .text-link {
      background: none;
      border: none;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
      padding: 0;
      transition: color .15s;
    }
    .text-link:hover { color: var(--text); }

    /* ── Grocery view ─────────────────────────────────────────────── */
    .empty-state {
      padding: 80px 20px;
      text-align: center;
    }

    .empty-state p {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 20px;
      font-style: italic;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--primary-fg);
      border: none;
      border-radius: var(--r-sm);
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s;
    }

    .btn-primary:hover { background: var(--primary-h); }
    .btn-primary:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    .grocery-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .grocery-recipes {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 16px;
      font-style: italic;
      color: var(--text-muted);
      max-width: 520px;
      line-height: 1.5;
    }

    .action-row {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .action-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, border-color .15s;
    }

    .action-btn:hover { background: var(--surface-2); border-color: var(--text-muted); }
    .action-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    .action-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-fg);
    }

    .action-btn.primary:hover { background: var(--primary-h); border-color: var(--primary-h); }

    .action-btn.danger {
      margin-left: auto;
      color: var(--danger);
      border-color: var(--danger-border);
    }

    .action-btn.danger:hover { background: var(--danger-bg); border-color: var(--danger); }

    /* ── Extras (custom items) ────────────────────────────────────────── */
    .extras-section { margin-top: 8px; margin-bottom: 36px; }

    .add-extra-form {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .add-extra-input {
      flex: 1;
      min-width: 0;
      padding: 8px 12px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      outline: none;
      transition: border-color .15s;
    }

    .add-extra-input::placeholder { color: var(--text-muted); }
    .add-extra-input:focus { border-color: var(--primary); }

    .add-extra-btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      background: var(--primary);
      border: 1px solid var(--primary);
      border-radius: var(--r-sm);
      color: var(--primary-fg);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background .15s;
    }

    .add-extra-btn:hover { background: var(--primary-h); border-color: var(--primary-h); }
    .add-extra-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    .extra-item {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 11px 6px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      border-radius: var(--r-sm);
      -webkit-tap-highlight-color: transparent;
      transition: background .12s, opacity .2s;
    }

    .extra-item:last-of-type { border-bottom: none; }
    .extra-item:hover { background: var(--surface-2); }
    .extra-item.done { opacity: .38; }
    .extra-item:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    .extra-item.done .item-check {
      background: var(--primary);
      border-color: var(--primary);
    }

    .extra-item.done .item-check-icon { opacity: 1; }
    .extra-item.done .item-name { text-decoration: line-through; }

    .extra-del {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
      transition: color .12s, background .12s;
    }

    .extra-del:hover { color: var(--danger); background: var(--danger-bg); }

    /* ── Category sections ────────────────────────────────────────── */
    .category-section { margin-bottom: 36px; }

    .cat-heading {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0;
    }

    /* ── Grocery item ─────────────────────────────────────────────── */
    .grocery-item {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 11px 6px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      border-radius: var(--r-sm);
      -webkit-tap-highlight-color: transparent;
      transition: background .12s, opacity .2s;
    }

    .grocery-item:last-child { border-bottom: none; }

    .grocery-item:hover { background: var(--surface-2); }

    .grocery-item.done { opacity: .38; }

    .grocery-item:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    .item-check {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
    }

    .grocery-item.done .item-check {
      background: var(--primary);
      border-color: var(--primary);
    }

    .item-check-icon {
      width: 10px;
      height: 10px;
      color: var(--primary-fg);
      opacity: 0;
      transition: opacity .15s;
    }

    .grocery-item.done .item-check-icon { opacity: 1; }

    .item-body { flex: 1; min-width: 0; }

    .item-name {
      font-size: 15px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: text-decoration .15s;
    }

    .grocery-item.done .item-name { text-decoration: line-through; }

    .item-source {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-amount {
      font-size: 13.5px;
      color: var(--text-muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      text-align: right;
      flex-shrink: 0;
    }

    /* ── Float bar ────────────────────────────────────────────────── */
    .float-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 300;
      background: var(--primary);
      color: var(--primary-fg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 24px;
      box-shadow: 0 -4px 20px rgba(0,0,0,.14);
    }

    .float-info { font-size: 14px; opacity: .82; }

    .float-cta {
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.28);
      color: var(--primary-fg);
      border-radius: var(--r-sm);
      padding: 8px 18px;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
    }

    .float-cta:hover { background: rgba(255,255,255,.28); }
    .float-cta:focus-visible { outline: 2px solid rgba(255,255,255,.8); outline-offset: 2px; }

    /* ── Toast ────────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--text);
      color: var(--bg);
      padding: 9px 18px;
      border-radius: var(--r-sm);
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      white-space: nowrap;
      z-index: 500;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Print ────────────────────────────────────────────────────── */
    @media print {
      header, .float-bar, .action-row, .view-eyebrow { display: none !important; }
      #recipe-view { display: none !important; }
      #grocery-view { display: block !important; }
      body, main { background: white; color: black; padding: 0; max-width: 100%; font-size: 11pt; }
      main { padding: 12px 16px; }
      .grocery-header { margin-bottom: 8px; }
      .grocery-recipes { font-size: 9pt; color: #555; font-style: italic; }
      .grocery-item.done, .extra-item.done { display: none; }
      .category-section { break-inside: avoid; page-break-inside: avoid; margin-bottom: 10px; }
      .extras-section { break-inside: avoid; page-break-inside: avoid; margin-bottom: 10px; }
      .cat-heading { font-size: 7.5pt; color: #555; border-bottom-color: #ccc; padding-bottom: 4px; }
      .grocery-item, .extra-item {
        padding: 3px 0;
        border-bottom-color: #eee;
        background: none !important;
        gap: 7px;
        min-height: 0;
      }
      .item-check { width: 11px; height: 11px; border: 1px solid #999; background: white; border-radius: 2px; }
      .item-check-icon { display: none; }
      .item-name { font-size: 10pt; }
      .item-source { font-size: 8pt; }
      .item-amount { font-size: 9pt; }
      .add-extra-form { display: none; }
    }

    /* ── Reduced motion ───────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">Dinner Plan</div>
    <nav class="view-nav" role="tablist" aria-label="Views">
      <button class="nav-btn active" id="nav-recipes" role="tab" aria-selected="true"
              onclick="switchView('recipes')">Recipes</button>
      <button class="nav-btn" id="nav-grocery" role="tab" aria-selected="false"
              onclick="switchView('grocery')">
        Grocery List
        <span class="badge" id="sel-badge" hidden></span>
      </button>
    </nav>
  </div>
</header>

<main>
  <!-- ── Recipes view ─────────────────────────────────── -->
  <div id="recipe-view" class="view active" role="tabpanel" aria-labelledby="nav-recipes">
    <div class="view-eyebrow">
      <span>Pick what you'd like to cook this week</span>
      <button class="text-link" id="clear-sel-btn" onclick="clearSelections()" hidden>Clear selections</button>
    </div>
    <div id="recipe-grid" class="recipe-grid">
      <div class="state-msg">Loading recipes…</div>
    </div>
  </div>

  <!-- ── Grocery view ─────────────────────────────────── -->
  <div id="grocery-view" class="view" role="tabpanel" aria-labelledby="nav-grocery">

    <div id="grocery-empty" class="empty-state">
      <p>No recipes selected yet.</p>
      <button class="btn-primary" onclick="switchView('recipes')">Browse recipes →</button>
    </div>

    <div id="grocery-content" hidden>
      <div class="grocery-header">
        <div id="grocery-recipes" class="grocery-recipes"></div>
        <div class="action-row">
          <button class="action-btn" id="uncheck-btn" onclick="uncheckAll()">Uncheck all</button>
          <button class="action-btn primary" onclick="shareList()">Share</button>
          <button class="action-btn" onclick="window.print()">Print</button>
          <button class="action-btn danger" onclick="resetAll()">Start over</button>
        </div>
      </div>
      <div id="grocery-list"></div>
    </div>

  </div>
</main>

<!-- Float bar: shows in recipe view when ≥1 recipe selected -->
<div class="float-bar" id="float-bar" hidden aria-live="polite">
  <span class="float-info" id="float-info"></span>
  <button class="float-cta" onclick="switchView('grocery')">View grocery list →</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ─────────────────────────────────────────────────────────────────────
   Constants
───────────────────────────────────────────────────────────────────── */
const CAT_ORDER  = ['produce','meat','dairy','pantry','herbs'];
const CAT_LABELS = {
  produce: 'Produce',
  meat:    'Meat & Seafood',
  dairy:   'Dairy & Eggs',
  pantry:  'Pantry & Dry Goods',
  herbs:   'Herbs & Spices',
  other:   'Other',
};

/* ─────────────────────────────────────────────────────────────────────
   State
───────────────────────────────────────────────────────────────────── */
const S = {
  recipes:  {},        // slug -> recipe object
  order:    [],        // slug order from index.json
  selected: new Set(), // selected recipe slugs
  checked:  new Set(), // "slug::i" keys for items already-have
  extras:   [],        // [{id, name, done}] custom items added manually
  view:     'recipes',
};

/* ─────────────────────────────────────────────────────────────────────
   Persistence (localStorage + URL hash)

   URL hash: comma-separated slugs, for sharing across devices.
   localStorage: checked items (device-local).
───────────────────────────────────────────────────────────────────── */
function loadState() {
  // URL hash → selected recipes (takes precedence for cross-device sharing)
  const hash = location.hash.slice(1);
  if (hash) {
    hash.split(',').map(s => s.trim()).filter(Boolean).forEach(s => S.selected.add(s));
  }

  try {
    const raw = localStorage.getItem('dinnerplan_v1');
    if (!raw) return;
    const saved = JSON.parse(raw);
    // Only restore selections from localStorage if no URL was provided
    if (!hash) (saved.selected || []).forEach(s => S.selected.add(s));
    (saved.checked  || []).forEach(k => S.checked.add(k));
    S.extras = (saved.extras || []).filter(e => e && e.id && e.name);
  } catch (_) {}
}

function saveState() {
  // Update URL hash with current selections (makes the list shareable)
  const slugs = [...S.selected].join(',');
  history.replaceState(null, '', slugs ? '#' + slugs : location.pathname + location.search);

  try {
    localStorage.setItem('dinnerplan_v1', JSON.stringify({
      selected: [...S.selected],
      checked:  [...S.checked],
      extras:   S.extras,
    }));
  } catch (_) {}
}

/* ─────────────────────────────────────────────────────────────────────
   Data loading
───────────────────────────────────────────────────────────────────── */
async function loadRecipes() {
  const grid = document.getElementById('recipe-grid');
  try {
    const slugs = await fetch('./recipes/index.json').then(r => {
      if (!r.ok) throw new Error('index');
      return r.json();
    });

    const pairs = await Promise.all(
      slugs.map(slug =>
        fetch(`./recipes/${slug}.json`)
          .then(r => { if (!r.ok) throw new Error(slug); return r.json(); })
          .then(data => [slug, data])
          .catch(() => [slug, null])
      )
    );

    pairs.forEach(([slug, data]) => {
      if (data) { S.recipes[slug] = data; S.order.push(slug); }
    });

    // Remove any selected slugs that failed to load
    [...S.selected].forEach(s => { if (!S.recipes[s]) S.selected.delete(s); });

    render();
  } catch (_) {
    grid.innerHTML = `<div class="state-msg error">
      Couldn't load recipes.<br>
      <small>Open via a web server — not directly as a file.<br>
      Locally: <code>npx serve .</code> in this directory.</small>
    </div>`;
  }
}

/* ─────────────────────────────────────────────────────────────────────
   Rendering
───────────────────────────────────────────────────────────────────── */
function render() {
  renderRecipes();
  renderGrocery();
  updateFloat();
  updateBadge();
}

function renderRecipes() {
  const grid = document.getElementById('recipe-grid');
  const clearBtn = document.getElementById('clear-sel-btn');
  // Restore keyboard focus after innerHTML replacement (Bug: focus dropped on toggle)
  const focusedSlug = document.activeElement?.closest?.('.recipe-card')?.dataset?.slug;

  clearBtn.hidden = S.selected.size === 0;

  if (!S.order.length) {
    grid.innerHTML = '<div class="state-msg">No recipes found.</div>';
    return;
  }

  grid.innerHTML = S.order.map(slug => {
    const r   = state(slug);
    const sel = S.selected.has(slug);
    const tags = (r.tags || []).map(t => `<span class="tag">${x(t)}</span>`).join('');
    const count = (r.ingredients || []).length;
    return `<div class="recipe-card${sel ? ' selected' : ''}"
                 data-slug="${slug}"
                 role="checkbox"
                 aria-checked="${sel}"
                 tabindex="0">
      <div class="card-check" aria-hidden="true">
        <svg class="card-check-icon" viewBox="0 0 11 11" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1.5,5.5 4.5,8.5 9.5,2.5"/>
        </svg>
      </div>
      <div class="card-name">${x(r.name)}</div>
      <div class="card-desc">${x(r.description || '')}</div>
      <div class="card-footer">
        <div class="card-meta">
          <span>${x(r.prepTime || '')}</span>
          <span class="card-meta-sep">·</span>
          <span>Serves ${x(String(r.servings || ''))}</span>
          <span class="card-meta-sep">·</span>
          <span>${count} ingredient${count !== 1 ? 's' : ''}</span>
        </div>
        <div class="card-tags">${tags}</div>
      </div>
    </div>`;
  }).join('');
  if (focusedSlug) document.querySelector(`.recipe-card[data-slug="${focusedSlug}"]`)?.focus();
}

function renderGrocery() {
  const empty   = document.getElementById('grocery-empty');
  const content = document.getElementById('grocery-content');
  const listEl  = document.getElementById('grocery-list');
  const recipes = document.getElementById('grocery-recipes');

  if (!S.selected.size && !S.extras.length) {
    empty.hidden   = false;
    content.hidden = true;
    return;
  }

  // Selections exist from URL/localStorage but recipes not fetched yet
  if (S.selected.size && !Object.keys(S.recipes).length) {
    empty.hidden   = true;
    content.hidden = false;
    recipes.textContent = '';
    listEl.innerHTML = '<div style="padding:48px;text-align:center;color:var(--muted)">Loading recipes…</div>';
    return;
  }

  empty.hidden   = true;
  content.hidden = false;

  const names = [...S.selected].filter(s => S.recipes[s]).map(s => S.recipes[s].name);
  recipes.textContent = names.join(', ');

  // Group by category
  const byCat = {};
  [...S.selected].forEach(slug => {
    const r = S.recipes[slug];
    if (!r) return;
    (r.ingredients || []).forEach((ing, i) => {
      const cat = ing.category || 'other';
      if (!byCat[cat]) byCat[cat] = [];
      byCat[cat].push({ slug, recipeName: r.name, ing, key: `${slug}::${i}` });
    });
  });

  const cats = [
    ...CAT_ORDER.filter(c => byCat[c]),
    ...Object.keys(byCat).filter(c => !CAT_ORDER.includes(c)),
  ];

  const multiRecipe = S.selected.size > 1;

  listEl.innerHTML = cats.map(cat => {
    const rows = byCat[cat].map(({ slug, recipeName, ing, key }) => {
      const done   = S.checked.has(key);
      const amount = [ing.amount, ing.unit].filter(Boolean).join(' ');
      return `<div class="grocery-item${done ? ' done' : ''}"
                   data-key="${x(key)}"
                   role="checkbox"
                   aria-checked="${done}"
                   tabindex="0">
        <div class="item-check" aria-hidden="true">
          <svg class="item-check-icon" viewBox="0 0 10 10" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1.5,5 4,7.5 8.5,2.5"/>
          </svg>
        </div>
        <div class="item-body">
          <div class="item-name">${x(ing.name)}</div>
          ${multiRecipe ? `<div class="item-source">${x(recipeName)}</div>` : ''}
        </div>
        <div class="item-amount">${x(amount)}</div>
      </div>`;
    }).join('');
    return `<div class="category-section">
      <div class="cat-heading">${x(CAT_LABELS[cat] || cat)}</div>
      ${rows}
    </div>`;
  }).join('');

  // Extras (custom items) section always appears at the bottom
  const extrasHtml = S.extras.map(e =>
    `<div class="extra-item${e.done ? ' done' : ''}"
          data-extra-id="${x(e.id)}"
          role="checkbox"
          aria-checked="${e.done}"
          tabindex="0">
      <div class="item-check" aria-hidden="true">
        <svg class="item-check-icon" viewBox="0 0 10 10" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1.5,5 4,7.5 8.5,2.5"/>
        </svg>
      </div>
      <div class="item-body">
        <div class="item-name">${x(e.name)}</div>
      </div>
      <button class="extra-del" aria-label="Remove ${x(e.name)}"
              onclick="event.stopPropagation(); removeExtra('${e.id.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">×</button>
    </div>`
  ).join('');

  listEl.innerHTML += `<div class="extras-section">
    <div class="cat-heading">Extra Items</div>
    ${extrasHtml}
    <div class="add-extra-form">
      <input class="add-extra-input" id="extra-input" type="text"
             placeholder="Add an item…" maxlength="120"
             onkeydown="if(event.key==='Enter')addExtra()">
      <button class="add-extra-btn" onclick="addExtra()">Add</button>
    </div>
  </div>`;
}

function updateFloat() {
  const bar  = document.getElementById('float-bar');
  const info = document.getElementById('float-info');
  if (S.view !== 'recipes' || !S.selected.size) { bar.hidden = true; return; }
  bar.hidden = false;
  const n     = S.selected.size;
  const total = [...S.selected].reduce((s, slug) => s + (S.recipes[slug]?.ingredients?.length || 0), 0);
  info.textContent = `${n} ${n === 1 ? 'recipe' : 'recipes'} · ${total} ingredients`;
}

function updateBadge() {
  const b = document.getElementById('sel-badge');
  const n = S.selected.size;
  b.hidden      = n === 0;
  b.textContent = String(n);
}

/* ─────────────────────────────────────────────────────────────────────
   Actions
───────────────────────────────────────────────────────────────────── */
function toggleRecipe(slug) {
  if (S.selected.has(slug)) S.selected.delete(slug);
  else S.selected.add(slug);
  saveState();
  render();
}

function toggleItem(key) {
  if (S.checked.has(key)) S.checked.delete(key);
  else S.checked.add(key);
  saveState();

  // Patch DOM directly — avoids scroll-jump from full re-render
  const el = document.querySelector(`.grocery-item[data-key="${key.replace(/\\/g,'\\\\').replace(/"/g,'\\"')}"]`);
  if (el) {
    const done = S.checked.has(key);
    el.classList.toggle('done', done);
    el.setAttribute('aria-checked', String(done));
  }
}

function uncheckAll() {
  S.checked.clear();
  S.extras.forEach(e => { e.done = false; });
  saveState();
  renderGrocery();
}

function clearSelections() {
  S.selected.clear();
  S.checked.clear();
  saveState();
  render();
}

function resetAll() {
  if (!confirm('Start over? This clears all recipes, checked items, and extra items.')) return;
  S.selected.clear();
  S.checked.clear();
  S.extras = [];
  saveState();
  switchView('recipes');
  render();
}

function addExtra() {
  const input = document.getElementById('extra-input');
  const name = (input?.value || '').trim();
  if (!name) return;
  S.extras.push({ id: String(Date.now() + Math.random()), name, done: false });
  saveState();
  renderGrocery();
  // Re-focus the input after re-render
  document.getElementById('extra-input')?.focus();
}

function removeExtra(id) {
  S.extras = S.extras.filter(e => e.id !== id);
  saveState();
  renderGrocery();
}

function toggleExtra(id) {
  const e = S.extras.find(e => e.id === id);
  if (!e) return;
  e.done = !e.done;
  saveState();
  // Patch DOM directly
  const el = document.querySelector(`.extra-item[data-extra-id="${CSS.escape(id)}"]`);
  if (el) {
    el.classList.toggle('done', e.done);
    el.setAttribute('aria-checked', String(e.done));
  }
}

function switchView(v) {
  S.view = v;
  document.getElementById('recipe-view').classList.toggle('active', v === 'recipes');
  document.getElementById('grocery-view').classList.toggle('active', v === 'grocery');
  document.getElementById('nav-recipes').classList.toggle('active', v === 'recipes');
  document.getElementById('nav-grocery').classList.toggle('active', v === 'grocery');
  document.getElementById('nav-recipes').setAttribute('aria-selected', String(v === 'recipes'));
  document.getElementById('nav-grocery').setAttribute('aria-selected', String(v === 'grocery'));
  if (v === 'grocery') { renderGrocery(); document.getElementById('float-bar').hidden = true; }
  if (v === 'recipes') updateFloat();
}

async function shareList() {
  const text = buildShareText();
  if (!text) return;
  try {
    if (navigator.share) {
      await navigator.share({ title: 'Grocery List', text });
    } else {
      await navigator.clipboard.writeText(text);
      toast('Copied to clipboard');
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      try { await navigator.clipboard.writeText(text); toast('Copied to clipboard'); } catch (_) {}
    }
  }
}

function buildShareText() {
  if (!S.selected.size && !S.extras.length) return '';
  const names = [...S.selected].filter(s => S.recipes[s]).map(s => S.recipes[s].name);
  const lines = ['🛒 Grocery List'];
  if (names.length) lines.push(`From: ${names.join(', ')}`);
  lines.push('');

  const byCat = {};
  [...S.selected].forEach(slug => {
    const r = S.recipes[slug];
    if (!r) return;
    (r.ingredients || []).forEach((ing, i) => {
      if (S.checked.has(`${slug}::${i}`)) return; // skip already-have items
      const cat = ing.category || 'other';
      if (!byCat[cat]) byCat[cat] = [];
      byCat[cat].push(ing);
    });
  });

  const cats = [...CAT_ORDER.filter(c => byCat[c]), ...Object.keys(byCat).filter(c => !CAT_ORDER.includes(c))];
  cats.forEach(cat => {
    lines.push((CAT_LABELS[cat] || cat).toUpperCase());
    byCat[cat].forEach(ing => {
      const amt = [ing.amount, ing.unit].filter(Boolean).join(' ');
      lines.push(`• ${ing.name}${amt ? ' — ' + amt : ''}`);
    });
    lines.push('');
  });

  const uncheckedExtras = S.extras.filter(e => !e.done);
  if (uncheckedExtras.length) {
    lines.push('OTHER');
    uncheckedExtras.forEach(e => lines.push(`• ${e.name}`));
    lines.push('');
  }

  return lines.join('\n').trim();
}

/* ─────────────────────────────────────────────────────────────────────
   Helpers
───────────────────────────────────────────────────────────────────── */
function state(slug) { return S.recipes[slug] || {}; }

// HTML-escape
function x(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

/* ─────────────────────────────────────────────────────────────────────
   Event delegation
───────────────────────────────────────────────────────────────────── */
document.getElementById('recipe-grid').addEventListener('click', e => {
  const card = e.target.closest('.recipe-card');
  if (card) toggleRecipe(card.dataset.slug);
});

document.getElementById('recipe-grid').addEventListener('keydown', e => {
  if (e.key !== ' ' && e.key !== 'Enter') return;
  const card = e.target.closest('.recipe-card');
  if (card) { e.preventDefault(); toggleRecipe(card.dataset.slug); }
});

document.addEventListener('click', e => {
  const item = e.target.closest('.grocery-item');
  if (item && item.dataset.key) toggleItem(item.dataset.key);
  const extra = e.target.closest('.extra-item');
  if (extra && extra.dataset.extraId && !e.target.closest('.extra-del')) toggleExtra(extra.dataset.extraId);
});

document.addEventListener('keydown', e => {
  if (e.key !== ' ' && e.key !== 'Enter') return;
  const item = e.target.closest('.grocery-item');
  if (item && item.dataset.key) { e.preventDefault(); toggleItem(item.dataset.key); }
  const extra = e.target.closest('.extra-item');
  if (extra && extra.dataset.extraId) { e.preventDefault(); toggleExtra(extra.dataset.extraId); }
});

/* ─────────────────────────────────────────────────────────────────────
   Boot
───────────────────────────────────────────────────────────────────── */
loadState();
loadRecipes();
</script>
</body>
</html>
